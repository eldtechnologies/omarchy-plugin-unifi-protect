name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commits: a moved tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Compile the helper
        run: python -m py_compile bin/eld-unifi-protect

      - name: Unit and relay tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Manifest is valid JSON with the expected entry points
        run: |
          python - <<'PY'
          import json, os
          m = json.load(open("manifest.json"))
          assert m["schemaVersion"] == 1, "schemaVersion"
          assert not m["id"].startswith("omarchy."), "reserved namespace"
          for path in m["entryPoints"].values():
              assert os.path.isfile(path), f"missing entry point {path}"
          print(m["id"], m["version"], "ok")
          PY

      - name: Shell scripts
        run: |
          bash -n install.sh uninstall.sh
          shellcheck install.sh uninstall.sh
