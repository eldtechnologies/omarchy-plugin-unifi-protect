# Pop-out player controls (eld-unifi-protect live).
#
# Camera-first: the wheel zooms into the picture instead of changing the
# volume, so you can look closer at a detail without leaving the window.
WHEEL_UP    add video-zoom 0.1
WHEEL_DOWN  add video-zoom -0.1
WHEEL_LEFT  add video-pan-x 0.05
WHEEL_RIGHT add video-pan-x -0.05
Ctrl+LEFT   add video-pan-x 0.05
Ctrl+RIGHT  add video-pan-x -0.05
Ctrl+UP     add video-pan-y 0.05
Ctrl+DOWN   add video-pan-y -0.05
Ctrl+0      set video-zoom 0; set video-pan-x 0; set video-pan-y 0
